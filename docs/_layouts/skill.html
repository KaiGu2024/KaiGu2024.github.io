<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{{ page.title | default: page.name | default: site.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/css/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
  <style>
    .skill-page { max-width: 820px; margin: 0 auto; padding: 4.5rem 2rem 5rem; }
    .skill-page__back { display: inline-block; margin-bottom: 2.5rem; font-size: 0.94rem; }
    .skill-page__eyebrow { color: var(--muted); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
    .skill-page h1 { margin: 0.35rem 0 0.8rem; font-family: var(--font-display); font-size: clamp(2rem, 5vw, 3.25rem); line-height: 1.2; }
    .skill-page__description { max-width: 48rem; color: var(--muted); font-size: 1.08rem; }
    .skill-page__rule { margin: 2.5rem 0; border: 0; border-top: 1px solid var(--border); }
    .skill-page__content h2 { margin: 2.5rem 0 0.8rem; font-family: var(--font-display); line-height: 1.3; }
    .skill-page__content h3 { margin: 1.8rem 0 0.65rem; font-family: var(--font-display); line-height: 1.35; }
    .skill-page__content p, .skill-page__content ul, .skill-page__content ol, .skill-page__content pre { margin: 0 0 1.2rem; }
    .skill-page__content ul, .skill-page__content ol { padding-left: 1.5rem; }
    .skill-page__content pre { overflow-x: auto; padding: 1rem 1.25rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 0.85rem; line-height: 1.6; }
    .skill-page__content code { font-family: var(--font-mono); font-size: 0.88em; }
    .skill-page__content :not(pre) > code { padding: 0.12em 0.3em; border-radius: 3px; background: var(--c-primary-soft); }
  </style>
</head>
<body>
  <main class="skill-page">
    <a class="skill-page__back" href="{{ '/' | relative_url }}#skills">&larr; All skills</a>
    <p class="skill-page__eyebrow">Agent skill</p>
    <h1>{{ page.title | default: page.name }}</h1>
    {% if page.description %}<p class="skill-page__description">{{ page.description }}</p>{% endif %}
    <hr class="skill-page__rule">
    <article class="skill-page__content">
      {{ content }}
    </article>
  </main>
</body>
</html>
